name: Bug report
description: Report a reproducible Oracle source or runtime defect without private data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. For a vulnerability, use the private reporting link in SECURITY.md.

        Never upload `.oracle/`, cookies, browser profiles, session dumps, prompts, responses, attachments, account identifiers, credentials, or conversation URLs. Use synthetic data and redact screenshots.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all private browser, account, session, prompt, attachment, and conversation data from this report.
          required: true
        - label: This is not a security vulnerability that belongs in private reporting.
          required: true
  - type: input
    id: revision
    attributes:
      label: Source revision
      description: Commit SHA or branch name, with no private repository URL.
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - WSL
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal redacted reproduction
      description: Use synthetic prompts, paths, files, accounts, and URLs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Paste only the minimum redacted error text; do not attach raw logs.
    validations:
      required: true
